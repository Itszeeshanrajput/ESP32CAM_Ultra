<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1118"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>CCTV</title>
<style>
:root{--bg:#0c1118;--p1:#131b26;--p2:#1a2432;--ln:#263346;--tx:#e8edf3;--dim:#8593a8;--amber:#f2a93b;--teal:#46c2b5;--red:#ef5b5b;--blue:#6aa9ff;--r:10px;

@media(prefers-color-scheme:light){:root{--bg:#eef1f5;--p1:#fff;--p2:#f2f5f9;--ln:#d5dce6;--tx:#17202b;--dim:#5c6b80;--amber:#c47a06;--teal:#0f8f80;--red:#d23b3b;--blue:#2563c9}}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--f);display:flex;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 13px;font-weight:600;font-size:.86rem}
button:hover{border-color:var(--amber)}button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--amber);color:#1b1200;border-color:var(--amber)}button.dng{color:var(--red)}button.dng:hover{background:var(--red);color:#fff;border-color:var(--red)}
button.sm{padding:4px 9px;font-size:.78rem}
input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px}
input[type=range]{width:100%;accent-color:var(--amber)}
nav{display:flex;flex-direction:column;gap:4px;width:84px;flex:none;background:var(--p1);border-right:1px solid var(--ln);padding:12px 8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--dim);font-size:.72rem;padding:10px 2px;border-radius:9px}
nav button.on{background:var(--p2);color:var(--amber)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0;overflow-y:auto;padding:18px 20px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:1.15rem;font-weight:700;flex:1;min-width:120px}
.chip{font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--p2);border:1px solid var(--ln);color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--teal);border-color:var(--teal)}.chip.warn{color:var(--amber);border-color:var(--amber)}.chip.bad{color:var(--red);border-color:var(--red)}
.chip.rec{background:var(--red);border-color:var(--red);color:#fff;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.5}}
.banner{display:none;background:rgba(239,91,91,.14);border:1px solid var(--red);color:var(--red);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:.85rem}
.banner.show{display:block}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr}@media(min-width:1050px){.g2{grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr)}}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.card h2{font-size:.95rem;margin-bottom:10px}
.vid{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.vid img{width:100%;height:100%;object-fit:contain}
.vid .hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.vid .hud .chip{background:rgba(12,17,24,.78);backdrop-filter:blur(6px)}
.vid .osd{position:absolute;left:8px;bottom:8px;font:600 .74rem ui-monospace,Menlo,monospace;background:rgba(0,0,0,.55);color:#fff;padding:2px 7px;border-radius:4px}
.meter{position:absolute;right:8px;bottom:8px;width:90px;height:6px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--amber);width:0;transition:width .25s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fld{margin-bottom:13px}.fld>label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);font-weight:600;margin-bottom:5px}.fld>label b{color:var(--tx)}
.hint{font-size:.74rem;color:var(--dim);margin-top:4px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.sw:last-child{border:0}
.sw .t{font-weight:600;font-size:.88rem}.sw .s{font-size:.74rem;color:var(--dim)}
.tog{appearance:none;position:relative;width:44px;height:25px;flex:none;background:var(--p2);border:1px solid var(--ln);border-radius:99px;cursor:pointer;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--dim);transition:.15s}
.tog:checked{background:var(--amber);border-color:var(--amber)}.tog:checked::after{left:22px;background:#1b1200}
.tabs{display:flex;gap:4px;background:var(--p2);padding:4px;border-radius:9px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;color:var(--dim);white-space:nowrap;padding:7px 10px}.tabs button.on{background:var(--p1);color:var(--tx)}
.adv{display:none!important}.showadv .adv{display:block!important}.showadv .sw.adv,.showadv .row.adv{display:flex!important}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.st{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}.st .k{font-size:.7rem;color:var(--dim)}.st .v{font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.bar{display:flex;height:9px;background:var(--p2);border-radius:9px;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--dim)}.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0}.days button{flex:none}.days button.on{background:var(--amber);color:#1b1200;border-color:var(--amber)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
.item .nm{flex:1;min-width:0;font-weight:600;font-size:.86rem;word-break:break-all}.item .mt{font-size:.72rem;color:var(--dim)}
.tag{font-size:.66rem;font-weight:700;border-radius:5px;padding:1px 6px;border:1px solid currentColor;margin-right:6px}
.t-rec{color:var(--blue)}.t-mot{color:var(--amber)}.t-tl{color:#c39bff}.t-img{color:var(--teal)}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ev{background:var(--p2);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}.ev img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;display:block}.ev div{padding:8px 10px;font-size:.8rem}
.modal{position:fixed;inset:0;background:rgba(3,6,10,.86);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.on{display:flex}
.box{background:var(--p1);border:1px solid var(--ln);border-radius:12px;width:100%;max-width:800px;padding:14px;max-height:100%;overflow:auto}
.zone{position:relative}.zone img{width:100%;display:block;border-radius:6px;aspect-ratio:4/3;object-fit:cover;background:#000}
.zg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(12,1fr);touch-action:none}
.zg i{border:1px solid rgba(255,255,255,.18);background:rgba(239,91,91,.42)}.zg i.on{background:rgba(70,194,181,.22)}
pre.log{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;font:.7rem/1.6 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.lE{color:var(--red)}.lW{color:var(--amber)}

#gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}#gate.on{display:flex}

.mono{font-family:ui-monospace,Menlo,monospace}
@media(max-width:760px){body{flex-direction:column-reverse}nav{flex-direction:row;width:100%;border-right:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}nav button{flex:1;padding:6px 0}main{padding:12px 12px 20px}#toast{bottom:90px}}

</style></head><body>

<div id="gate"><form id="gform"></form></div>

<nav id="nav" aria-label="Sections"></nav>
<main id="main">
  <div class="top"><h1 id="ttl">CCTV</h1><span class="chip" id="c-net">connecting</span><span class="chip" id="c-sd">SD</span><span class="chip rec" id="c-rec" style="display:none">REC</span><button class="sm" id="b-out" style="display:none">Sign out</button></div>
  <div class="banner" id="lost">Connection to the camera lost. Retrying...</div>
  <section id="v-live"></section><section id="v-files" hidden></section><section id="v-events" hidden></section>
  <section id="v-set" hidden></section><section id="v-net" hidden></section><section id="v-sys" hidden></section>
</main>

<div class="modal" id="m-play"><div class="box">
  <div class="row" style="margin:0 0 10px"><b id="pl-t" style="flex:1;word-break:break-all"></b><button class="sm" id="pl-x">Close</button></div>
  <div class="vid"><img id="pl-img" alt="clip frame"></div>
  <input type="range" id="pl-sk" min="0" max="0" value="0" style="margin-top:10px" aria-label="Seek">
  <div class="row"><button id="pl-b">-10s</button><button id="pl-p" class="pri">Play</button><button id="pl-f">Next frame</button><button id="pl-s">1x</button><button id="pl-fs">Fullscreen</button><a id="pl-d"><button>Download</button></a><span class="hint mono" id="pl-i" style="margin:0"></span></div>
  <div class="hint" id="pl-n"></div>
</div></div>
<div class="modal" id="m-zone"><div class="box">
  <div class="row" style="margin:0 0 10px"><b style="flex:1">Motion zones</b><button class="sm" id="z-x">Close</button></div>
  <div class="zone"><img id="z-img" alt="camera view"><div class="zg" id="z-g"></div></div>
  <div class="hint">Tap or drag cells. Green cells are watched; red cells are ignored (trees, roads, screens).</div>
  <div class="row"><button id="z-all">Watch all</button><button id="z-none">Ignore all</button><button class="pri" id="z-save">Save zones</button></div>
</div></div>
<div id="toast" role="status"></div>

<script>

/* ---------- navigation ---------- */
const ICON={live:'<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',files:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',events:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',net:'<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>',sys:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'};
const NAV=[['live','Live'],['files','Files'],['events','Events'],['set','Settings'],['net','Network'],['sys','System']];
function buildNav(){const n=$('#nav');n.innerHTML='';NAV.forEach(([id,l])=>{if(S.role<2&&['set','net','sys'].includes(id))return;
  const b=h('button',{'data-v':id,onclick:()=>go(id)});b.innerHTML='<svg viewBox="0 0 24 24">'+ICON[id]+'</svg>'+l;n.append(b)})}
function go(v){view=v;document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='v-'+v);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#ttl').textContent=(NAV.find(x=>x[0]===v)||[0,'CCTV'])[1]+(C.camname?' - '+C.camname:'');
  if(v==='live')liveOn();else liveOff();({files:loadFiles,events:loadEvents,set:renderSettings,net:renderNet,sys:renderSys})[v]&&({files:loadFiles,events:loadEvents,set:renderSettings,net:renderNet,sys:renderSys})[v]()}

/* ---------- login / forced password change ---------- */
function gate(mode){const g=$('#gate'),f=$('#gform');g.classList.add('on');f.innerHTML='';liveOff();
  if(mode==='login'){f.append(h('h2',{text:'Sign in'}),h('input',{type:'text',id:'g-u',placeholder:'Username',autocomplete:'username'}),h('input',{type:'password',id:'g-p',placeholder:'Password',autocomplete:'current-password'}),h('button',{class:'pri',type:'submit',text:'Sign in'}),h('div',{class:'hint',id:'g-e'}));
    f.onsubmit=async e=>{e.preventDefault();try{const j=await post('/api/login',{user:$('#g-u').value,pass:$('#g-p').value});S.csrf=j.csrf;S.role=j.role;S.must=j.must;g.classList.remove('on');j.must?gate('pw'):boot()}catch(x){$('#g-e').textContent=x&&x.error==='locked'?'Too many attempts. Wait 5 minutes.':'Wrong username or password.'}}}
  else{f.append(h('h2',{text:'Choose a new admin password'}),h('div',{class:'hint',text:'The default password must be changed before you can use the camera. Minimum 6 characters.'}),h('input',{type:'password',id:'n-c',placeholder:'Current password',autocomplete:'current-password'}),h('input',{type:'text',id:'n-u',placeholder:'Admin username',value:'admin'}),h('input',{type:'password',id:'n-p',placeholder:'New password',autocomplete:'new-password'}),h('button',{class:'pri',type:'submit',text:'Save password'}),h('div',{class:'hint',id:'g-e'}));
    f.onsubmit=async e=>{e.preventDefault();try{await post('/api/account',{role:'admin',cur:$('#n-c').value,user:$('#n-u').value,pass:$('#n-p').value});toast('Password changed. Sign in again.');S.role=0;gate('login')}catch(x){$('#g-e').textContent=x&&x.error==='wrongcur'?'Current password is wrong.':'Use at least 6 characters and not "admin".'}}}}

/* ---------- LIVE ---------- */
function liveOn(){const i=$('#live');if(i&&!i.src.includes(':81'))i.src=MEDIA+'/stream?'+Date.now();startPoll()}

document.addEventListener('visibilitychange',()=>{document.hidden?liveOff():(view==='live'&&liveOn())});
function buildLive(){const el=$('#v-live');el.innerHTML='';
  const vid=h('div',{class:'vid'},h('img',{id:'live',alt:'live view',onerror:()=>setTimeout(()=>view==='live'&&!document.hidden&&liveOn(),3000)}),h('div',{class:'hud'},h('div',{},h('span',{class:'chip ok',id:'l-fps',text:'idle'})),h('div',{},h('span',{class:'chip',id:'l-mode'}))),h('div',{class:'osd',id:'l-osd'}),h('div',{class:'meter',title:'Motion level'},h('i',{id:'l-m'})));
  const ctl=h('div',{class:'card'},h('h2',{text:'Controls'}));
  if(S.role>=2){
    ctl.append(swRow('Armed','Motion alerts and motion recording',()=>!!C.armed,v=>save('armed',v?1:0)));
    ctl.append(h('div',{class:'fld'},h('label',{},'Flash LED ',h('b',{id:'fl-v',text:'0%'})),h('input',{type:'range',min:0,max:200,value:0,id:'flash',oninput:e=>{$('#fl-v').textContent=Math.round(e.target.value/2)+'%'},onchange:e=>post('/api/flash',{val:e.target.value})}),h('div',{class:'hint',text:'Turns itself off after 10 minutes.'})));
    ctl.append(h('div',{class:'fld'},h('label',{text:'Camera profile'}),h('div',{class:'row',style:'margin:0'},['day','night','indoor'].map(n=>h('button',{class:'sm',text:n[0].toUpperCase()+n.slice(1),onclick:()=>post('/api/preset',{name:n}).then(()=>toast('Profile applied'))})))));
    ctl.append(h('div',{class:'row'},h('button',{class:'pri',text:'Save snapshot',onclick:()=>post('/api/snapshot').then(j=>toast('Saved '+j.path)).catch(()=>toast('Snapshot failed'))}),h('a',{href:'/capture?dl=1',download:'snapshot.jpg'},h('button',{text:'Download now'})),h('button',{text:'Fullscreen',onclick:()=>$('#live').requestFullscreen&&$('#live').requestFullscreen()})));
  }else ctl.append(h('div',{class:'row'},h('a',{href:'/capture?dl=1'},h('button',{class:'pri',text:'Download snapshot'})),h('button',{text:'Fullscreen',onclick:()=>$('#live').requestFullscreen&&$('#live').requestFullscreen()})));
  ctl.append(h('div',{class:'stats',style:'margin-top:12px'},stat('Motion','s-m'),stat('Day/night','s-n'),stat('Viewers','s-v'),stat('Free heap','s-h')));
  el.append(h('div',{class:'grid g2'},h('div',{class:'card'},vid),ctl))}
const stat=(k,id)=>h('div',{class:'st'},h('div',{class:'k',text:k}),h('div',{class:'v',id,text:'-'}));

/* ---------- status polling ---------- */
function startPoll(){clearInterval(statusTimer);poll();statusTimer=setInterval(()=>{if(!document.hidden)poll()},3000)}
async function poll(){try{const d=await api('/api/status');ST=d;lostCount=0;$('#lost').classList.remove('show');

/* ---------- FILES + PLAYER ---------- */
let F={days:[],day:'',files:[],type:'all',sort:'new',q:'',sel:new Set()};
const TYPES=[['all','All',''],['rec','24/7','rec_'],['mot','Motion','mot_'],['tl','Time-lapse','tl_'],['img','Images','']];
const kind=n=>n.startsWith('rec_')?'rec':n.startsWith('mot_')?'mot':n.startsWith('tl_')?'tl':'img';
